

<style>
.navbar {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: min(1100px, calc(100% - 28px));
    height: 68px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(14, 14, 18, .88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 22px;
    box-shadow:
        0 18px 50px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.08);
    z-index: 1000;
}

.logo {
    display: flex;
    align-items: center;
    gap: 9px;
    color: white;
    text-decoration: none;
    font-size: 21px;
    font-weight: 900;
    padding-left: 12px;
}

.logo-icon {
    width: 35px;
    height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 11px;
    background: linear-gradient(135deg, #fff, #bbb);
    color: #111;
    font-size: 18px;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 5px;
}

.nav-links a {
    padding: 10px 13px;
    color: #d8d8d8;
    text-decoration: none;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 700;
    transition: .25s ease;
}

.nav-links a:hover,
.nav-links a.active {
    color: white;
    background: rgba(255,255,255,.10);
    transform: translateY(-2px);
}

.nav-dropdown {
    position: relative;
    display: inline-block;
}

.nav-dropdown-btn {
    background: none;
    border: none;
    padding: 10px 13px;
    color: #d8d8d8;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: .25s ease;
}

.nav-dropdown-btn:hover {
    color: white;
    background: rgba(255,255,255,.10);
    transform: translateY(-2px);
}

.nav-dropdown-content {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: #111;
    min-width: 150px;
    flex-direction: column;
    border-radius: 12px;
    overflow: hidden;
}

.nav-dropdown:hover .nav-dropdown-content {
    display: flex;
}

.nav-dropdown-content a {
    padding: 10px;
    white-space: nowrap;
    text-decoration: none;
}

.login-btn {
    padding: 10px 20px;
    margin-left: 8px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: white;
    font-size: 13px;
    font-weight: 700;
    box-shadow:
        0 4px 15px rgba(0,0,0,.15),
        inset 0 1px 0 rgba(255,255,255,.25);
    transition: .25s ease;
}

.login-btn:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: translateY(-2px);
}

.menu-btn {
    display: none;
    width: 43px;
    height: 43px;
    border: none;
    border-radius: 13px;
    background: rgba(255,255,255,.08);
    color: white;
    font-size: 21px;
    cursor: pointer;
}

@media (max-width: 850px) {

    .menu-btn {
        display: block;
    }

    .nav-links {
        position: absolute;
        top: 70px;
        left: 0;
        right: 0;
        padding: 10px;
        display: none;
        flex-direction: column;
        background: rgba(15,15,18,.96);
        backdrop-filter: blur(20px);
        border-radius: 18px;
    }

    .nav-links.active {
        display: flex;
    }

    .nav-links a {
        width: 100%;
        padding: 13px 15px;
    }

    .nav-dropdown {
        width: 100%;
    }

    .nav-dropdown-btn {
        width: 100%;
        text-align: left;
    }

    .nav-dropdown-content {
        position: static;
        display: none;
        background: rgba(255,255,255,.05);
        border-radius: 12px;
        margin-top: 5px;
    }

    .nav-dropdown.open .nav-dropdown-content {
        display: flex;
    }
}
</style>

<nav class="navbar">

    <a href="index.html" class="logo">
        <span class="logo-icon">⚡</span>
        GymFuel
    </a>

    <div class="nav-links" id="navLinks">
        <a href="plates.html">🍽️ my plates</a>
        <a href="ingrediants.html">🥗 Ingredients</a>
        <a href="calculator.html">🧮 Calculator</a>
        <a href="chat.html"> Chat</a>

        <div class="nav-dropdown">
            <button class="nav-dropdown-btn"><a href="main.html">✦ Plans</a></button>
            <div class="nav-dropdown-content">
                <a href="main.html#superenergy">⚡ Energy</a>
                <a href="main.html#bulking">💪 Bulking</a>
                <a href="main.html#cutting">🔥 Cutting</a>
                <a href="main.html#snacks">🍿 Snacks</a>
            </div>
        </div>

        <a href="main.html#learn">✦ Learn</a>
        <a href="login.html" class="login-btn">Log In</a>

    </div>

    <button class="menu-btn" id="menuBtn">☰</button>

</nav>

<script>
  
(function() {
    const menuBtn = document.getElementById('menuBtn');
    const navLinks = document.getElementById('navLinks');

    menuBtn.addEventListener('click', function() {
        navLinks.classList.toggle('active');
    });

    // On mobile, tapping "Plans" opens/closes the dropdown
    // (hover doesn't work on touch screens)
    const dropdownBtn = document.querySelector('.nav-dropdown-btn');
    const dropdown = document.querySelector('.nav-dropdown');

    dropdownBtn.addEventListener('click', function() {
        if (window.innerWidth <= 850) {
            dropdown.classList.toggle('open');
        }
    });
})();

  const username = localStorage.getItem('username');

   if (username) {
    const loginBtn = document.querySelector('.login-btn');
    loginBtn.textContent = username;
    loginBtn.href = "/profile.html";
    loginBtn.classList.remove('login-btn');
    loginBtn.classList.add('nav-dropdown-btn');
}
</script>
