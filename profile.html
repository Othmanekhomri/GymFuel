<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymFuel - Profile</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    min-height: 100vh; font-family: Arial, Helvetica, sans-serif; color: white;
    background: #000;
    overflow-x: hidden;
}
#aura { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .85; }
.page { position: relative; z-index: 1; }
a { text-decoration: none; color: inherit; }

.page { min-height: 100vh; padding: 120px 20px 60px; display: flex; flex-direction: column; align-items: center; }

.profile-card {
    width: 100%; max-width: 560px; padding: 35px 30px; text-align: center;
    background: rgba(18,18,22,.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,.14); border-radius: 24px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.09);
    animation: enter .8s ease both;
}
@keyframes enter {
    from { opacity: 0; transform: translateY(25px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.avatar {
    width: 84px; height: 84px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: linear-gradient(135deg, #fff, #bbb); color: #111; font-size: 34px; font-weight: 900;
}
.profile-name { font-size: clamp(28px, 6vw, 40px); letter-spacing: -1px; margin-bottom: 6px; }
.profile-sub { color: rgba(255,255,255,.55); font-size: 12px; font-weight: 700; letter-spacing: 1px; margin-bottom: 26px; }
.profile-kcal { color: rgba(255,255,255,.75); font-size: 14px; font-weight: 800; margin-bottom: 20px; }
.logout-btn {
    display: inline-block; padding: 12px 26px; border-radius: 14px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.22);
    color: white; font-size: 12px; font-weight: 800; letter-spacing: .5px; cursor: pointer; transition: .25s ease;
}
.logout-btn:hover { background: rgba(255,90,90,.18); border-color: rgba(255,120,120,.5); transform: translateY(-2px); }

/* TROPHIES */
.trophies-section {
    width: 100%; max-width: 700px; margin-top: 25px; padding: 30px;
    background: rgba(18,18,22,.55); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 24px;
}
.trophies-section h2 { font-size: 20px; margin-bottom: 5px; }
.trophies-section p { color: rgba(255,255,255,.5); font-size: 12px; margin-bottom: 20px; }
.trophies-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 22px; }

.card { width: 190px; height: 254px; cursor: pointer; perspective: 1000px; }
.card .content {
    position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transition: transform 400ms; box-shadow: 0 0 10px 1px #000000ee; border-radius: 12px;
}
.card.flipped .content { transform: rotateY(180deg); }

.card .front, .card .back {
    position: absolute; width: 100%; height: 100%; background-color: #151515;
    backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px; overflow: hidden;
}

/* picture side */
.card .back { display: flex; align-items: center; justify-content: center; }
.card:not(.locked) .back::before {
    content: ''; position: absolute; display: block; width: 160px; height: 160%;
    background: linear-gradient(90deg, transparent, #a855f7, #ff3dbb, #a855f7, transparent);
    animation: rotation_481 5000ms infinite linear;
}
@keyframes rotation_481 { 0% { transform: rotateZ(0deg); } 100% { transform: rotateZ(360deg); } }
.card .back-content {
    position: absolute; width: 96%; height: 96%; background-color: #151515; border-radius: 10px; color: white;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; padding: 14px; text-align: center;
}
.card .back-content img { width: 110px; height: 110px; object-fit: contain; }
.card .back-content .badge-name { font-size: 15px; font-weight: 900; }
.card .back-content .flip-hint { font-size: 10px; color: rgba(255,255,255,.4); letter-spacing: .5px; }

/* description side */
.card .front { transform: rotateY(180deg); color: white; }
.card .front .front-content {
    position: absolute; width: 100%; height: 100%; padding: 16px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; text-align: center;
}
.card .badge-tag {
    background-color: #00000055; padding: 3px 12px; border-radius: 10px; width: fit-content;
    font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
}
.card .front-name { font-size: 16px; font-weight: 900; }
.card .description {
    box-shadow: 0 0 10px 5px #00000088; width: 100%; padding: 12px; background-color: #00000099;
    border-radius: 8px; font-size: 12px; line-height: 1.5; color: rgba(255,255,255,.85);
}

/* NOT OWNED YET: dimmed */
.card.locked .content { box-shadow: none; }
.card.locked .back, .card.locked .front { border: 1px solid rgba(255,255,255,.14); background: #151515; }
.card.locked .back-content { width: 100%; height: 100%; border-radius: 12px; }
.card:not(.locked) .badge-tag { background: rgba(168,85,247,.22); color: #d8b4fe; border: 1px solid rgba(168,85,247,.55); }
.card.locked .back-content img { filter: grayscale(1) brightness(.45); opacity: .55; }
.card.locked .back-content .badge-name { color: rgba(255,255,255,.4); }
.card.locked .badge-tag { color: rgba(255,255,255,.6); }

@media (max-width: 500px) { .trophies-grid { gap: 14px; } }

/* INFINITY STONE */
.enter-btn {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    opacity: 0; pointer-events: none; color: #d8b4fe; font: 700 12px serif; letter-spacing: 4px; cursor: pointer;
    text-shadow: 0 0 10px #a855f7; transition: color .3s;
}
.enter-btn.show { opacity: 1; pointer-events: auto; animation: enterFade 3.5s ease forwards, enterPulse 1.6s 3.5s ease-in-out infinite; }
.enter-btn:hover { color: #fff; }
@keyframes enterFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes enterPulse { 50% { opacity: .45; } }
.dust-word { display: inline-block; white-space: nowrap; }
.dust-ch { display: inline-block; }
.card.stripped .description { background: transparent; box-shadow: none; transition: background 1s, box-shadow 1s; }
.card.stripped .badge-tag { background: transparent !important; border-color: transparent !important; transition: background 1s, border-color 1s; }
.grain { position: fixed; border-radius: 50%; pointer-events: none; opacity: 0; will-change: transform; }

body.bh-go .card:not(.infinity-card) { opacity: 0; transition: none; }
#debris { position: fixed; inset: 0; z-index: 10000; pointer-events: none; }
#bhCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 9999; }
#bhFlash { position: fixed; width: 80px; height: 80px; border-radius: 50%; background: #fff; box-shadow: 0 0 60px 40px #fff; z-index: 10000; pointer-events: none; opacity: 1;
  transform: translate(-50%,-50%) scale(1); transition: transform .45s cubic-bezier(.12,.8,.2,1), opacity 1.5s ease-out .2s; }
#bhMsg { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(90vw,560px); z-index: 10001; text-align: center;
  color: #f9f7fa; font: 600 17px/1.8 Arial, sans-serif; letter-spacing: .4px; text-shadow: 0 0 14px rgba(233, 225, 241, 0.9); opacity: 0; transition: opacity 1.2s; pointer-events: none; }
#bhMsg.show { opacity: 1; }
/* return star: orbits with the stars, then grows and settles under the text */
#bhReturn { position: fixed; left: 0; top: 0; z-index: 10002; background: none; border: none; color: #fff; font: 34px/1 Arial, Helvetica, sans-serif; cursor: default;
  text-shadow: 0 0 8px #fff, 0 0 20px rgba(255,255,255,.55); opacity: 0; pointer-events: none; transition: opacity 2s, text-shadow .3s; will-change: transform; }
#bhReturn.show { opacity: 1; }
#bhReturn.ready { pointer-events: auto; cursor: pointer; animation: twinkle 2.6s ease-in-out infinite; }
#bhReturn.ready:hover { text-shadow: 0 0 12px #fff, 0 0 30px rgba(255,255,255,.8); }
#bhReturn:focus-visible { outline: 1px solid #fff; outline-offset: 8px; border-radius: 50%; }
@keyframes twinkle { 50% { opacity: .55; } }
#bhRing { position: fixed; width: 80px; height: 80px; border-radius: 50%; border: 2px solid rgba(255,255,255,.9); z-index: 10000; pointer-events: none; opacity: .9;
  transform: translate(-50%,-50%) scale(1); transition: transform 1.8s cubic-bezier(.1,.6,.2,1), opacity 1.8s ease-out; }
#bhBars i { position: fixed; left: 0; width: 100%; height: 0; background: #000; z-index: 10003; pointer-events: none; transition: height 2.5s ease; }
#bhBars i:first-child { top: 0; } #bhBars i:last-child { bottom: 0; }
#bhBars.on i { height: 7vh; }
.infinity-card .flip-hint { color: rgba(216,180,254,.75); letter-spacing: 1px; }
</style>
</head>

<body>
<canvas id="aura"></canvas>
<div id="navbarPlaceholder"></div>

<main class="page">

    <section class="profile-card">
        <div class="avatar" id="avatarLetter">?</div>
        <div class="profile-name" id="profileName">Loading...</div>
        <div class="profile-sub">GYMFUEL MEMBER</div>
        <div class="profile-kcal" id="profileKcal">— kcal / day</div>
        <button class="logout-btn" id="logoutBtn">Log Out</button><br><br><br>
        <a href="credit.html" style="color: #a855f7;">watch credit</a>
    </section>

    <section class="trophies-section">
        <h2>Trophies</h2>
        <p id="trophiesCount">Tap a trophy to see how to earn it.</p>
        <div class="trophies-grid" id="trophiesGrid"></div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.141.0/build/three.min.js"></script>
<script src="./supabase-client.js"></script>
<script>
(function () {
    const username = localStorage.getItem('username');

    if (!username) {
        window.location.href = "login.html";
        return;
    }

    document.getElementById('profileName').textContent = username;
    document.getElementById('avatarLetter').textContent = username.charAt(0).toUpperCase();

    supabaseClient
        .from('bruh')
        .select('call')
        .eq('name', username)
        .single()
        .then(({ data, error }) => {
            if (error) { console.error('Could not load kcal:', error.message); return; }
            document.getElementById('profileKcal').textContent = `${data.call} kcal / day`;
        });

    loadBadges(username);

    async function loadBadges(username) {
        const { data: allBadges, error: allError } = await supabaseClient
            .from('badges')
            .select('*');

        if (allError) { console.error('Could not load badges:', allError.message); return; }

        const { data: owned, error: ownedError } = await supabaseClient
            .from('user_badges')
            .select('badges(name)')
            .eq('user_name', username);

        if (ownedError) { console.error('Could not load your badges:', ownedError.message); return; }

        const ownedNames = new Set((owned || []).filter(r => r.badges).map(r => r.badges.name));

        const list = (allBadges || []).map(b => ({ ...b, isOwned: ownedNames.has(b.name) }))
                                      .sort((a, b) => Number(b.isOwned) - Number(a.isOwned));

        const grid = document.getElementById('trophiesGrid');
        grid.innerHTML = '';

        list.forEach(badge => {
            const isInf = Number(badge.id) === 7;
            const card = document.createElement('div');
            card.className = 'card' + (badge.isOwned ? '' : ' locked') + (isInf ? ' infinity-card' : '');
            card.innerHTML = `
                <div class="content">
                    <div class="back">
                        <div class="back-content">
                            <img src="badges/${badge.icon_url}.png" alt="${badge.name}">
                            <div class="badge-name">${badge.name}</div>
                            <div class="flip-hint">${isInf ? "Don't tap to flip" : 'Tap to flip'}</div>
                        </div>
                    </div>
                    <div class="front">
                        <div class="front-content">
                            <div class="badge-tag">${badge.isOwned ? 'Earned' : 'Locked'}</div>
                            <div class="front-name">${badge.name}</div>
                            <div class="description">${badge.description}</div>
                            ${isInf ? '<div class="enter-btn" id="enterBtn">ENTER</div>' : ''}
                        </div>
                    </div>
                </div>
            `;
            card.addEventListener('click', () => {
                if (isInf) {
                    if (card.classList.contains('flipped')) return;
                    card.classList.add('flipped');
                    startInfinity(card);
                    return;
                }
                card.classList.toggle('flipped');
            });
            grid.appendChild(card);
        });

        document.getElementById('trophiesCount').textContent =
            `${ownedNames.size} of ${list.length} unlocked — tap a trophy to see how to earn it.`;
    }

    document.getElementById('logoutBtn').addEventListener('click', function () {
        localStorage.removeItem('username');
        window.location.href = "index.html";
    });
})();
</script>

<script>
const canvas = document.getElementById("aura");
const ctx = canvas.getContext("2d");
let w, h;
function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const colors = ["0,212,255", "168,85,247", "255,61,187", "120,200,255"];
const particles = [];
for (let i = 0; i < 160; i++) {
    particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2 + 0.6,
        speed: Math.random() * 0.5 + 0.05,
        drift: (Math.random() - 0.5) * 0.3,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: Math.random() * 0.5 + 0.15
    });
}

let auraHole = null;
function animate() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
        if (p.dead) return;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = `rgba(${p.color}, ${p.alpha})`;
        ctx.fill();
        if (auraHole) {
            const dx = auraHole.x - p.x, dy = auraHole.y - p.y, d = Math.hypot(dx, dy) || 1;
            const pull = auraHole.t * (2 + 900 / d);
            p.x += (dx / d * .6 - dy / d * 1.4) * pull;
            p.y += (dy / d * .6 + dx / d * 1.4) * pull;
            if (d < auraHole.r * .7 + 8) p.dead = true;
        } else {
            p.y -= p.speed;
            p.x += p.drift;
            if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
        }
    });
    requestAnimationFrame(animate);
}
animate();
</script>

<script>
/* ===== INFINITY STONE: earthquake -> staggered break -> orbit -> ENTER -> black hole eats all -> shrinks -> flash -> colored stars ===== */
let sAc, shardsEaten = false;
function playSong() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) sAc = new AC();
    const song = new Audio('blackhole.mp3');       // put blackhole.mp3 next to this html file
    song.volume = 0;
    song.play().catch(e => console.warn('Could not play blackhole.mp3:', e));
    const fade = setInterval(() => {
        song.volume = Math.min(.9, song.volume + .03);
        if (song.volume >= .9) clearInterval(fade);
    }, 100);
}
function boom() {
    if (!sAc) return;
    const t = sAc.currentTime, o = sAc.createOscillator(), g = sAc.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(90, t);
    o.frequency.exponentialRampToValueAtTime(28, t + 1);
    g.gain.setValueAtTime(.9, t);
    g.gain.exponentialRampToValueAtTime(.001, t + 2.5);
    o.connect(g); g.connect(sAc.destination); o.start(t); o.stop(t + 2.5);
}

/* earthquake rumble: brown noise + sub-bass with a trembling gain, swells with the quake and fades once everything has left */
function startRumble() {
    if (!sAc) return;
    if (sAc.state === 'suspended') sAc.resume();
    const t = sAc.currentTime, n = sAc.sampleRate * 2, buf = sAc.createBuffer(1, n, sAc.sampleRate), d = buf.getChannelData(0);
    let l = 0;
    for (let i = 0; i < n; i++) { l = (l + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = l * 3.5; }
    const src = sAc.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = sAc.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(90, t); lp.frequency.linearRampToValueAtTime(260, t + 4.5);
    const sub = sAc.createOscillator(), subG = sAc.createGain();
    sub.type = 'sine'; sub.frequency.setValueAtTime(30, t); sub.frequency.linearRampToValueAtTime(48, t + 4.5); subG.gain.value = .7;
    const env = sAc.createGain(), trem = sAc.createGain(), lfo = sAc.createOscillator(), lfoG = sAc.createGain();
    trem.gain.value = .7; lfo.frequency.value = 9; lfoG.gain.value = .3;          // shaky amplitude
    lfo.connect(lfoG); lfoG.connect(trem.gain);
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(.75, t + 4.5);                                  // builds with the quake
    env.gain.setValueAtTime(.75, t + 8);
    env.gain.linearRampToValueAtTime(0, t + 10);                                     // dies as the last pieces reach orbit
    src.connect(lp); lp.connect(env); sub.connect(subG); subG.connect(env);
    env.connect(trem); trem.connect(sAc.destination);
    [src, sub, lfo].forEach(o => { o.start(t); o.stop(t + 10.2); });
}

/* the card's text turns to sand and joins the orbit */
function dustCardText(card, debris, grains, ccx, ccy) {
    const chars = [];
    card.querySelectorAll('.badge-tag, .front-name, .description').forEach(el => {
        const words = el.textContent.trim().split(/\s+/);
        el.textContent = '';
        words.forEach((wd, i) => {
            const ws = document.createElement('span');
            ws.className = 'dust-word';
            [...wd].forEach(c => {
                const s = document.createElement('span');
                s.className = 'dust-ch'; s.textContent = c;
                ws.appendChild(s); chars.push(s);
            });
            el.appendChild(ws);
            if (i < words.length - 1) el.appendChild(document.createTextNode(' '));
        });
    });
    setTimeout(() => {
        card.classList.add('stripped');
        chars.forEach(s => {
            const r = s.getBoundingClientRect();
            if (!r.width) return;
            const delay = Math.random() * 4.5, col = getComputedStyle(s).color;
            s.style.transition = `opacity .3s ease ${delay}s`;
            s.style.opacity = 0;
            for (let i = 0; i < 5; i++) {
                const q = document.createElement('i'), sz = 1.5 + Math.random() * 1.8;
                const px = r.left + Math.random() * r.width, py = r.top + Math.random() * r.height;
                q.className = 'grain';
                q.style.cssText = `left:${px}px;top:${py}px;width:${sz}px;height:${sz}px;background:${col}`;
                debris.appendChild(q);
                grains.push({
                    q, px, py, a: Math.atan2(py - ccy, px - ccx), r0: Math.hypot(px - ccx, py - ccy),
                    tr: 110 + Math.random() * 170, w: 1 + Math.random() * 1.2,
                    appear: delay, rel: delay + .3 + Math.random() * 1.2, shown: false, done: false, delay: 0, dur: 2000
                });
            }
        });
    }, 1000);
}

function startInfinity(card) {
    playSong();
    startRumble();
    document.body.style.overflow = 'hidden';
    const skip = ['SCRIPT', 'STYLE', 'CANVAS', 'LINK', 'META'];
    const vw = innerWidth, vh = innerHeight;
    const cr = card.getBoundingClientRect();
    const ccx = cr.left + cr.width / 2, ccy = cr.top + cr.height / 2;

    const leaves = [...document.body.querySelectorAll('*')].filter(el => {
        if (el.children.length || skip.includes(el.tagName) || card.contains(el)) return false;
        if (!el.textContent.trim() && el.tagName !== 'IMG') return false;
        const c = el.closest('.card');
        if (c && !!el.closest('.front') !== c.classList.contains('flipped')) return false;
        const r = el.getBoundingClientRect();
        return r.width > 0 && r.bottom > 0 && r.top < vh && r.right > 0 && r.left < vw;
    });
    leaves.forEach(el => {
        if (getComputedStyle(el).display === 'inline') el.style.display = 'inline-block';
        el.style.transition = 'none';
    });
    const pc = document.querySelector('.profile-card');
    pc.style.animation = 'none';
    const boxes = [...leaves, pc, ...document.querySelectorAll('.card:not(.infinity-card)'), card];

    const debris = document.createElement('div');
    debris.id = 'debris';
    document.body.appendChild(debris);
    const bars = document.createElement('div');          // cinematic letterbox
    bars.id = 'bhBars'; bars.innerHTML = '<i></i><i></i>';
    document.body.appendChild(bars);
    requestAnimationFrame(() => bars.classList.add('on'));
    [...document.body.children].filter(el => {           // the fixed navbar (site name) gets pushed below the top bar
        if (skip.includes(el.tagName) || el.id === 'debris' || el.id === 'bhBars') return false;
        const cs = getComputedStyle(el), r = el.getBoundingClientRect();
        return (cs.position === 'fixed' || cs.position === 'sticky') && r.height > 0 && r.top < 20 && r.height < vh * .4;
    }).forEach(el => { el.style.transition = 'translate 2.5s ease'; el.style.translate = '0 7vh'; });

    const grains = [], dustT0 = performance.now() + 1000;
    dustCardText(card, debris, grains, ccx, ccy);
    setTimeout(() => document.getElementById('enterBtn').classList.add('show'), 10000);

    let phase = 0, shards = [], eating = false, eatT0 = 0, oT0 = 0, last = performance.now(), hx = vw / 2, hy = vh / 2;
    const t0 = last, QUAKE = 4500;   // ms of earthquake before things break

    function breakApart() {
        document.body.classList.add('bh-go');
        boxes.forEach(el => el.style.transform = '');
        const rects = leaves.map(el => el.getBoundingClientRect());
        // glass panels / borders melt away slowly
        document.querySelectorAll('body *').forEach(el => {
            if (el.children.length && !card.contains(el) && !skip.includes(el.tagName) && el.id !== 'debris') {
                el.style.transition = 'none';
                el.style.background = 'transparent';
                el.style.borderColor = 'transparent';
                el.style.boxShadow = 'none';
                el.style.backdropFilter = 'none';
                el.style.webkitBackdropFilter = 'none';
            }
        });
        leaves.forEach((el, i) => {
            const r = rects[i], cs = getComputedStyle(el), W = r.width, H = r.height;
            const base = el.cloneNode(true);
            base.removeAttribute('id');
            for (const p of cs) base.style.setProperty(p, cs.getPropertyValue(p));
            const S = (k, v) => base.style.setProperty(k, v, 'important');

        const f = 1 - Math.pow(1 - 1 / 80, dt * 60);                       // design's expansion rate, frame-rate independent
        c.fillStyle = 'rgba(25,25,25,0.2)'; c.fillRect(0, 0, W, H);
        c.lineWidth = 1.2;
        for (const s of stars) {
            s.r += (s.target - s.r) * f;
            const a = s.start + T * s.speed / 100;                         // design: currentTime * speed / 2
            const x = ccx + s.r * Math.cos(a), y = ccy + s.r * Math.sin(a);
            if (!s.init) { s.init = true; s.px = x; s.py = y; }
            c.strokeStyle = `rgba(${s.col},${s.al})`;
            c.beginPath(); c.moveTo(s.px, s.py); c.lineTo(x, y); c.stroke();
            s.px = x; s.py = y;
        }
        oa += .44 * dt;
        const R = Math.min(W, H) * .3, ox = cx + R * Math.cos(oa), oy = cy + R * .8 * Math.sin(oa);
        let e2 = 0;
        if (settleT) { const kk = Math.min(1, (now - settleT) / 6000); e2 = kk * kk * (3 - 2 * kk); if (kk >= 1) btn.classList.add('ready'); }
        rot += (1 - e2) * 2 * dt;
        const x = ox + (fx - ox) * e2, y = oy + (fy - oy) * e2, sc = .8 + 1.6 * e2;
        btn.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) rotate(${rot}rad) scale(${sc})`;
        requestAnimationFrame(loop);
    })(t0);
}
</script>

<script>
fetch('navbar.html')
  .then(res => res.text())
  .then(html => {
    const temp = document.createElement('div');
    temp.innerHTML = html;

    const scripts = temp.querySelectorAll('script');
    scripts.forEach(s => s.remove());
    document.getElementById('navbarPlaceholder').replaceWith(...temp.childNodes);

    scripts.forEach(oldScript => {
      const newScript = document.createElement('script');
      newScript.textContent = oldScript.textContent;
      document.body.appendChild(newScript);
    });
  });
</script>
