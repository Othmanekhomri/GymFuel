<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymFuel - Profile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background:
                linear-gradient(
                    rgba(8, 8, 12, .62),
                    rgba(8, 8, 12, .82)
                ),
                url("https://images.unsplash.com/photo-1723639904881-d7213fc8a526?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D")
                center center / cover fixed no-repeat;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .page {
            min-height: 100vh;
            padding: 120px 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================
           PROFILE HEADER CARD
        ========================= */

        .profile-card {
            width: 100%;
            max-width: 560px;
            padding: 35px 30px;
            text-align: center;

            background: rgba(18,18,22,.72);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 24px;
            box-shadow:
                0 30px 80px rgba(0,0,0,.45),
                inset 0 1px 0 rgba(255,255,255,.09);

            animation: enter .8s ease both;
        }

        @keyframes enter {
            from { opacity: 0; transform: translateY(25px) scale(.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .avatar {
            width: 84px;
            height: 84px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, #fff, #bbb);
            color: #111;
            font-size: 34px;
            font-weight: 900;
        }

        .profile-name {
            font-size: clamp(28px, 6vw, 40px);
            letter-spacing: -1px;
            margin-bottom: 6px;
        }

        .profile-sub {
            color: rgba(255,255,255,.55);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 26px;
        }

        .logout-btn {
            display: inline-block;
            padding: 12px 26px;
            border-radius: 14px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.22);
            color: white;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .5px;
            cursor: pointer;
            transition: .25s ease;
        }

        .logout-btn:hover {
            background: rgba(255,90,90,.18);
            border-color: rgba(255,120,120,.5);
            transform: translateY(-2px);
        }

        /* =========================
           TROPHIES SECTION
        ========================= */

        .trophies-section {
            width: 100%;
            max-width: 560px;
            margin-top: 25px;
            padding: 30px;

            background: rgba(18,18,22,.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 24px;
        }

        .trophies-section h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .trophies-section p {
            color: rgba(255,255,255,.5);
            font-size: 12px;
            margin-bottom: 20px;
        }

        .trophies-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .trophy-slot {
            aspect-ratio: 1;
            border-radius: 16px;
            border: 1px dashed rgba(255,255,255,.22);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,.3);
            font-size: 11px;
            text-align: center;
        }

        @media (max-width: 500px) {
            .trophies-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
.profile-kcal {
    color: rgba(255,255,255,.75);
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 20px;
}
    </style>
</head>

<body>

    <div id="navbarPlaceholder"></div>

    <main class="page">

        <section class="profile-card">
            <div class="avatar" id="avatarLetter">?</div>
            <div class="profile-name" id="profileName">Loading...</div>
            <div class="profile-sub">GYMFUEL MEMBER</div>
            
<div class="profile-kcal" id="profileKcal">— kcal / day</div>

            <button class="logout-btn" id="logoutBtn">Log Out</button>
        </section>

        <section class="trophies-section">
            <h2>Trophies</h2>
            <p>Coming soon — track your progress here.</p>

            <div class="trophies-grid" id="trophiesGrid">
                <div class="trophy-slot">Empty</div>
                <div class="trophy-slot">Empty</div>
                <div class="trophy-slot">Empty</div>
            </div>
        </section>

    </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-client.js"></script> 
    <script>

      (function() {
    const username = localStorage.getItem('username');

    if (!username) {
        window.location.href = "login.html";
    } else {
        document.getElementById('profileName').textContent = username;
        document.getElementById('avatarLetter').textContent = username.charAt(0).toUpperCase();

        supabaseClient
            .from('bruh')
            .select('call')
            .eq('name', username)
            .single()
            .then(({ data, error }) => {
                if (error) {
                    console.error('Could not load kcal:', error.message);
                    return;
                }
                document.getElementById('profileKcal').textContent = `${data.call} kcal / day`;
            });
    }

    document.getElementById('logoutBtn').addEventListener('click', function() {
        localStorage.removeItem('username');
        window.location.href = "index.html";
    });
})();


</script>
<script>
fetch('navbar.html')
  .then(res => res.text())
  .then(html => {
    const temp = document.createElement('div');
    temp.innerHTML = html;

    const scripts = temp.querySelectorAll('script');
    scripts.forEach(s => s.remove());
    document.getElementById('navbarPlaceholder').replaceWith(...temp.childNodes);

    scripts.forEach(oldScript => {
      const newScript = document.createElement('script');
      newScript.textContent = oldScript.textContent;
      document.body.appendChild(newScript);
    });
  });
</script>
</body>
</html>
