<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GymFuel - Create Account</title>

    <style>

        /* =========================
           RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            color: white;

            background:
                linear-gradient(
                    rgba(8, 8, 12, .62),
                    rgba(8, 8, 12, .82)
                ),
                url("https://images.unsplash.com/photo-1723639904881-d7213fc8a526?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D")
                center center / cover fixed no-repeat;

            overflow-x: hidden;
        }


        /* =========================
           BACKGROUND EFFECTS
        ========================== */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255,255,255,.08),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(255,255,255,.05),
                    transparent 35%
                );

            pointer-events: none;
        }


        /* =========================
           NAVBAR
        ========================== */

        .navbar {
            position: fixed;

            top: 14px;
            left: 50%;

            transform: translateX(-50%);

            width: min(1100px, calc(100% - 28px));
            height: 68px;

            padding: 8px 10px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(14, 14, 18, .78);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255,255,255,.12);

            border-radius: 22px;

            box-shadow:
                0 18px 50px rgba(0,0,0,.35),
                inset 0 1px 0 rgba(255,255,255,.08);

            z-index: 10;
        }


        .logo {
            display: flex;
            align-items: center;

            gap: 9px;

            color: white;

            font-size: 21px;
            font-weight: 900;

            padding-left: 12px;
        }


        .logo-icon {
            width: 35px;
            height: 35px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background: linear-gradient(135deg, #fff, #bbb);

            color: #111;

            font-size: 18px;
        }


        /* =========================
           PAGE
        ========================== */

        .page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 120px 20px 50px;

            position: relative;
        }


        /* =========================
           REGISTER CONTAINER
        ========================== */

        .register-container {
            width: 100%;
            max-width: 480px;

            animation: enter .8s ease both;
        }


        @keyframes enter {

            from {
                opacity: 0;
                transform: translateY(25px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        /* =========================
           TOP TITLE
        ========================== */

        .intro {
            text-align: center;

            margin-bottom: 25px;
        }


        .badge {
            display: inline-block;

            padding: 8px 17px;

            margin-bottom: 18px;

            border-radius: 30px;

            background: rgba(255,255,255,.09);

            border: 1px solid rgba(255,255,255,.18);

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 2px;
        }


        .intro h1 {
            font-size: clamp(42px, 9vw, 64px);

            line-height: .95;

            letter-spacing: -3px;

            margin-bottom: 15px;
        }


        .intro p {
            max-width: 390px;

            margin: auto;

            color: rgba(255,255,255,.68);

            font-size: 14px;

            line-height: 1.6;
        }


        /* =========================
           GLASS CARD
        ========================== */

        .card {

            position: relative;

            padding: 30px;

            background: rgba(18,18,22,.72);

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            border: 1px solid rgba(255,255,255,.14);

            border-radius: 24px;

            box-shadow:
                0 30px 80px rgba(0,0,0,.45),
                inset 0 1px 0 rgba(255,255,255,.09);

            overflow: hidden;
        }


        .card::before {

            content: "";

            position: absolute;

            top: 0;
            left: 15%;

            width: 70%;
            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.6),
                transparent
            );

            opacity: .5;
        }


        /* =========================
           PRIVACY MESSAGE
        ========================== */

        .privacy {

            padding: 16px 17px;

            margin-bottom: 25px;

            border-radius: 16px;

            background: rgba(255,255,255,.06);

            border: 1px solid rgba(255,255,255,.10);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.04);
        }


        .privacy-title {

            display: flex;
            align-items: center;

            gap: 9px;

            margin-bottom: 7px;

            font-size: 12px;

            font-weight: 800;
        }


        .privacy-icon {

            width: 25px;
            height: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(255,255,255,.14);

            border: 1px solid rgba(255,255,255,.18);

            font-size: 11px;
        }


        .privacy p {

            color: rgba(255,255,255,.62);

            font-size: 11px;

            line-height: 1.55;
        }


        /* =========================
           FORM
        ========================== */

        .field {
            margin-bottom: 17px;
        }


        .field label {

            display: block;

            margin-bottom: 8px;

            color: rgba(255,255,255,.7);

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }


        .input {

            width: 100%;

            height: 56px;

            padding: 0 17px;

            border-radius: 14px;

            border: 1px solid rgba(255,255,255,.12);

            background: rgba(255,255,255,.055);

            backdrop-filter: blur(10px);

            color: white;

            outline: none;

            font-size: 14px;

            transition:
                .25s ease;
        }


        .input::placeholder {
            color: rgba(255,255,255,.35);
        }


        .input:hover {
            background: rgba(255,255,255,.075);

            border-color: rgba(255,255,255,.2);
        }


        .input:focus {

            background: rgba(255,255,255,.09);

            border-color: rgba(255,255,255,.45);

            box-shadow:
                0 0 0 3px rgba(255,255,255,.05);
        }


        /* =========================
           CREATE BUTTON
        ========================== */

        .create-btn {

            position: relative;

            width: 100%;
            height: 57px;

            margin-top: 5px;

            border: 1px solid rgba(255,255,255,.8);

            border-radius: 15px;

            background: white;

            color: #111;

            font-size: 12px;

            font-weight: 900;

            letter-spacing: 1.5px;

            cursor: pointer;

            overflow: hidden;

            transition: .3s ease;
        }


        .create-btn::before {

            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 70%;
            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(0,0,0,.08),
                transparent
            );

            transform: skewX(-25deg);

            transition: .6s ease;
        }


        .create-btn:hover::before {
            left: 140%;
        }


        .create-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 15px 35px rgba(0,0,0,.35);
        }


        .create-btn:active {
            transform: translateY(0);
        }


        /* =========================
           LOGIN
        ========================== */

        .login {

            text-align: center;

            margin-top: 23px;

            color: rgba(255,255,255,.48);

            font-size: 12px;
        }


        .login a {

            color: white;

            font-weight: 800;

            text-decoration: none;

            margin-left: 4px;

            border-bottom: 1px solid rgba(255,255,255,.35);

            transition: .2s;
        }


        .login a:hover {
            border-color: white;
        }


        /* =========================
           FOOTER TEXT
        ========================== */

        .bottom-text {

            text-align: center;

            margin-top: 25px;

            color: rgba(255,255,255,.32);

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 4px;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .navbar {
                top: 9px;

                width: calc(100% - 18px);
            }


            .page {

                padding:
                    105px 14px
                    35px;
            }


            .intro {
                margin-bottom: 20px;
            }


            .intro h1 {

                font-size: 43px;

                letter-spacing: -2px;
            }


            .intro p {
                font-size: 13px;
            }


            .card {

                padding: 21px 18px;

                border-radius: 20px;
            }


            .privacy {
                padding: 14px;
            }


            .input {
                height: 54px;
            }


            .create-btn {
                height: 55px;
            }

        }


        /* =========================
           SMALL PHONES
        ========================== */

        @media (max-width: 380px) {

            .page {
                padding-top: 95px;
            }


            .intro h1 {
                font-size: 38px;
            }


            .card {
                padding: 18px 15px;
            }

        }

    </style>
</head>


<body>

<div id="navbarPlaceholder"></div>

    <!-- =========================
         REGISTER PAGE
    ========================== -->

    <main class="page">

        <div class="register-container">


            <!-- INTRO -->

            <div class="intro">

                <span class="badge">
                    GYMFUEL MEMBERS
                </span>

                <h1>
                    login
                </h1>

                <p>
                    Your fitness journey starts here.
                </p>

            </div>



            <!-- CARD -->

            <section class="card">


                <!-- PRIVACY -->

                <div class="privacy">

                    <div class="privacy-title">

                        <span class="privacy-icon">
                            ✓
                        </span>

                       

                    </div>

                    <p>
                       Emails are like toothbrushes,don't share'em!<br>
                       GymFuel will never ask for your email
                    </p>

                </div>



                <!-- FORM -->

                <form id="registerForm">


                    <!-- NAME -->

                    <div class="field">

                        <label for="name">
                            Name
                        </label>

                        <input
                            class="input"
                            type="text"
                            id="name"
                            name="name"
                            placeholder="username "
                            autocomplete="username"
                            required
                        >

                    </div>



                    <!-- PASSWORD -->

                    <div class="field">

                        <label for="password">
                            Password
                        </label>

                        <input
                            class="input"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="password"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <!-- BUTTON -->

                    <button class="create-btn"type="submit">
                        log in
                    </button>


                </form>



                <!-- LOGIN -->

                <div class="login">

                    dot have a account

                    <a href="createacc.html">
                        sign in 
                    </a>

                </div>


            </section>



            <div class="bottom-text">
                TRAIN · EAT · GROW
            </div>


        </div>

    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-client.js"></script>

 <script>

const form = document.getElementById("registerForm");

form.addEventListener("submit", async function (e) {

  e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient
  .from('bruh')
  .select('*')
  .eq('name', name)
  .eq('password', password);

if (error) {
  console.error('Something went wrong:', error.message);
  return;
}

if (data.length === 0) {
  console.log('Wrong email or password');
} else {
  localStorage.setItem('username', name);
  window.location.href = "../main.html";
}

});

</script>
<script>
fetch('/navbar.html')
  .then(res => res.text())
  .then(html => {
    const temp = document.createElement('div');
    temp.innerHTML = html;

    const scripts = temp.querySelectorAll('script');
    scripts.forEach(s => s.remove());
    document.getElementById('navbarPlaceholder').replaceWith(...temp.childNodes);

    scripts.forEach(oldScript => {
      const newScript = document.createElement('script');
      newScript.textContent = oldScript.textContent;
      document.body.appendChild(newScript);
    });
  });
</script>

</body>
</html>
